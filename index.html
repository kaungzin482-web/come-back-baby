<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Myanmar Text', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .gif-container img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
        }
        h2 {
            color: #d81b60;
            font-size: 20px;
            margin: 20px 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #yesBtn {
            background-color: #ff4081;
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
        }
        /* No နှိပ်ရင်ပေါ်မယ့် စာသားအတွက် စတိုင် */
        #warningText {
            color: #e91e63;
            font-size: 13px;
            margin-top: 15px;
            height: 20px;
            font-weight: bold;
        }
        .agreement-list {
            text-align: left;
            font-size: 14px;
            color: #444;
            margin-bottom: 20px;
        }
        .agreement-list li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="card" id="cardContent">
        <div class="gif-container">
            <img id="cardImage" src="https://media1.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Bear">
        </div>
        <h2 id="questionText">ကိုကိုတို့ပြန်တွဲကြမလား ?</h2>
        <div class="btn-container" id="btnContainer">
            <button id="yesBtn" onclick="nextStep()">Yes</button>
            <button id="noBtn" onclick="moveNoButton()">No</button>
        </div>
        <!-- No နှိပ်ရင်ပေါ်မယ့် စာနေရာ -->
        <div id="warningText"></div>
    </div>

    <script>
        let step = 1;

        // No နှိပ်လိုက်ရင် ခလုတ်လည်း ရွေ့မယ်၊ အောက်မှာလည်း စာပေါ်လာမယ်
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const warningText = document.getElementById('warningText');
            
            // ပေါ်လာမယ့် စာသားများ (ကြိုက်တာပြောင်းလို့ရပါတယ်)
            const messages = [
                "စဉ်းစားပေးပါဦးနော်... 🥺",
                "မငြင်းနဲ့လေ... လူဆိုးမလေး 😢",
                "တစ်ချက်လောက် ပြန်စဉ်းစားပေးပါဗျာ ❤️",
                "No ကို နှိပ်လို့မရဘူးနော် 😜"
            ];
            
            // စာသားတွေကို ကျပန်းပေါ်စေရန်
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            warningText.innerHTML = randomMsg;

            // ခလုတ်နေရာ ရွှေ့ရန်
            const x = Math.random() * 140 - 70;
            const y = Math.random() * 100 - 50;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Yes နှိပ်ရင် နောက်တစ်ဆင့်ပြောင်းရန်
        function nextStep() {
            step++;
            const questionText = document.getElementById('questionText');
            const cardImage = document.getElementById('cardImage');
            const btnContainer = document.getElementById('btnContainer');
            const cardContent = document.getElementById('cardContent');
            const warningText = document.getElementById('warningText');

            // Yes နှိပ်လိုက်ရင် အောက်က သတိပေးစာကို ဖျောက်ပေးမယ်
            if(warningText) warningText.innerHTML = "";

            if (step === 2) {
                questionText.innerHTML = "သတိရနေတုန်း လားလေး...";
                cardImage.src = "https://media.giphy.com/media/3o7TKSjRrfIPjeiOkM/giphy.gif";
            } else if (step === 3) {
                questionText.innerHTML = "ကိုကို ကိုချစ်သေးတယ်မလား ?";
                cardImage.src = "https://media.giphy.com/media/L0SaMyy8Q6AcM/giphy.gif";
            } else if (step === 4) {
                questionText.innerHTML = "ကိုကိုဆီပြန်လာမယ်မလား.";
                cardImage.src = "https://media.giphy.com/media/13CoXPo72oy6UU/giphy.gif";
            } else if (step === 5) {
                questionText.innerHTML = "ဒါဆို ပြန်တွဲကြတာပေါ့နော် 😊";
                cardImage.src = "https://media.giphy.com/media/2vq1Xy9U3mR4z8c4y7/giphy.gif";
                
                btnContainer.innerHTML = "";
                let htmlContent = `
                    <h2 style="color: #d81b60; margin-bottom: 10px;">💕 Our Love Agreement 💕</h2>
                    <ul class="agreement-list">
                        <li>1. ကိုကိုဆီကထွက်မသွားရဘူးနော် ? <b>ဟုတ်</b></li>
                        <li>2. စကားများရင် ချော့ရမယ် ? <b>ချော့မယ်</b></li>
                        <li>3. ကိုကို့စကားနားထောင်ရမယ် ? <b>ဟုတ်</b></li>
                        <li>4. အမြဲတမ်းချစ်ရမယ် ? <b>ချစ်တယ်</b></li>
                    </ul>
                    <button id="yesBtn" style="width: 100%;" onclick="finishAgreement()">သဘောတူတယ် နှိပ်လိုက်ပါ 🤍</button>
                `;
                cardContent.innerHTML = htmlContent;
            }
        }

        function finishAgreement() {
            alert('Love you so much! ❤️ အမြဲတမ်း အတူတူရှိပေးပါနော်။ချစ်တယ်နော် ကိုကို ခလေးရေ');
        }
    </script>
</body>
  </html>
