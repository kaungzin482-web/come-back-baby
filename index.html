<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Myanmar Text', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .gif-container img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
        }
        h2 {
            color: #d81b60;
            font-size: 20px;
            margin: 20px 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #yesBtn {
            background-color: #ff4081;
            color: white;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #333;
            position: relative;
        }
        .agreement-list {
            text-align: left;
            font-size: 14px;
            color: #444;
            margin-bottom: 20px;
        }
        .agreement-list li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="card" id="cardContent">
        <div class="gif-container">
            <!-- ချစ်စရာ GIF ပုံလေးများ -->
            <img id="cardImage" src="https://media1.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Bear">
        </div>
        <h2 id="questionText">ပြန်တွဲကြမလား ?</h2>
        <div class="btn-container" id="btnContainer">
            <button id="yesBtn" onclick="nextStep()">Yes</button>
            <button id="noBtn" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        let step = 1;

        // No ခလုတ်ကို နှိပ်မရအောင် ထွက်ပြေးစေသော Function
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * 150 - 75;
            const y = Math.random() * 150 - 75;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Yes နှိပ်တိုင်း စာနဲ့ ပုံများ ပြောင်းသွားစေသော Function
        function nextStep() {
            step++;
            const questionText = document.getElementById('questionText');
            const cardImage = document.getElementById('cardImage');
            const btnContainer = document.getElementById('btnContainer');
            const cardContent = document.getElementById('cardContent');

            if (step === 2) {
                questionText.innerHTML = "စကားမပြောရတဲ့အချိန် သတိရနေတယ်သိလား...";
                cardImage.src = "https://media.giphy.com/media/3o7TKSjRrfIPjeiOkM/giphy.gif";
            } else if (step === 3) {
                questionText.innerHTML = "ကိုကို ချစ်သေးတယ်မလား?";
                cardImage.src = "https://media.giphy.com/media/L0SaMyy8Q6AcM/giphy.gif";
            } else if (step === 4) {
                questionText.innerHTML = "ကိုကိုဆီ ပြန်လာမယ်မလား...";
                cardImage.src = "https://media.giphy.com/media/13CoXPo72oy6UU/giphy.gif";
            } else if (step === 5) {
                questionText.innerHTML = "ဒါဆို ပြန်တွဲကြမယ်နော် 😊";
                cardImage.src = "https://media.giphy.com/media/2vq1Xy9U3mR4z8c4y7/giphy.gif";
                
                // အနောက်ဆုံးအဆင့် - Our Love Agreement စာရင်းပြသခြင်း
                btnContainer.innerHTML = "";
                let htmlContent = `
                    <h2 style="color: #d81b60; margin-bottom: 10px;">💕 Our Love Agreement 💕</h2>
                    <ul class="agreement-list">
                        <li>1. ပြန်မပြောရဘူး ? <b>Yes</b></li>
                        <li>2. စကားများရင် ချော့ရမယ် ? <b>Yes</b></li>
                        <li>3. ကိုယ့်စကားနားထောင်ရမယ် ? <b>Yes</b></li>
                        <li>4. အမြဲတမ်းချစ်နေရမယ် ? <b>Yes</b></li>
                    </ul>
                    <button id="yesBtn" style="width: 100%;" onclick="finishAgreement()">သဘောတူတယ် နှိပ်လိုက်ပါ 🤍</button>
                `;
                cardContent.innerHTML = htmlContent;
            }
        }

        function finishAgreement() {
            alert('Love you so much! ❤️ အမြဲတမ်း အတူတူရှိပေးပါနော်။');
        }
    </script>
</body>
  </html>
